name: Verify BBrainX
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve or validate locked dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-fund; else npm install --ignore-scripts --no-fund; fi
          mkdir -p artifacts
          npm ls --all --json > artifacts/npm-tree.json
          npm audit --audit-level=high --json > artifacts/npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: |
            package-lock.json
            artifacts/npm-tree.json
            artifacts/npm-audit.json
  consolidated:
    needs: dependencies
    uses: ./.github/workflows/consolidated.yml
  minimum-node:
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: npm ci --ignore-scripts --no-fund
      - name: Verify the minimum supported Node release
        shell: bash
        run: |
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/tests-node22.log
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-node-evidence
          path: artifacts/tests-node22.log
  verify:
    needs: dependencies
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lock
      - run: npm ci --ignore-scripts --no-fund
      - name: Domain and real MCP integration
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm test 2>&1 | tee artifacts/tests-${{ matrix.os }}.log
      - run: npm run build
      - name: Host and synthetic benchmark
        shell: bash
        run: |
          node bin/bbrainx.mjs doctor > artifacts/doctor-${{ matrix.os }}.json
          node scripts/benchmark.mjs > artifacts/benchmark-console.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: artifacts/
  browser:
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lock
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/
            test-results/
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated Remotion dependencies
        working-directory: media
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-fund; else npm install --ignore-scripts --no-fund; fi
      - name: Render original presentation
        working-directory: media
        run: npm run render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-evidence
          path: |
            media/package-lock.json
            artifacts/bbrainx-intro.mp4
  upstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download upstream sources for inspection, not execution
        run: node scripts/sources.mjs --download
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-inventory
          path: artifacts/upstream-inventory.json
  publish-evidence:
    needs: [verify, minimum-node, browser, media, upstreams, consolidated]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refuse to overwrite a newer revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dependency-lock
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: .ci-evidence
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          path: .ci-browser
      - uses: actions/download-artifact@v4
        with:
          name: media-evidence
          path: .ci-media
      - uses: actions/download-artifact@v4
        with:
          name: upstream-inventory
          path: .ci-upstreams
      - uses: actions/download-artifact@v4
        with:
          name: BBrainX-Consolidated-Delivery
          path: .ci-consolidated
      - name: Collect observed evidence and exact dependency locks
        run: node scripts/collect-evidence.mjs
      - name: Publish only generated evidence and lockfiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json media/package-lock.json docs/validation public/demo README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish verified locks and evidence for ${GITHUB_SHA::8} [skip ci]"
            git push origin HEAD:main
          fi
      - name: Create source distribution without secrets or installed modules
        run: |
          node scripts/package.mjs
          python3 scripts/archive.py
      - uses: actions/upload-artifact@v4
        with:
          name: BBrainX-source-distribution
          path: |
            artifacts/BBrainX-v0.4.0-source.zip
            artifacts/SHA256SUMS.txt
            artifacts/source-manifest.json
