name: Publish verified developer preview
on:
  workflow_run:
    workflows: [Verify BBrainX]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the already verified source distribution
        run: gh run download "$RUN_ID" --name BBrainX-source-distribution --dir artifacts
      - name: Verify archive integrity and target ancestry
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          TARGET=$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('source-manifest.json'));if(!/^[a-f0-9]{40}$/.test(x.commit))process.exit(1);console.log(x.commit)")
          if [ "$TARGET" != "$TESTED_SHA" ]; then
            PARENT=$(gh api "repos/$GH_REPO/commits/$TARGET" --jq '.parents[0].sha')
            test "$PARENT" = "$TESTED_SHA"
          fi
          echo "RELEASE_TARGET=$TARGET" >> "$GITHUB_ENV"
      - name: Publish an immutable preview without replacing an existing tag
        run: |
          if gh release view v0.4.0-preview >/dev/null 2>&1; then
            echo 'Preview already exists; a later release requires a new explicit version.'
            exit 0
          fi
          cat > notes.md <<'NOTES'
          ## BBrainX — GODMODCODE / Developer Preview
          Local context, governed memory and verified handoffs across coding agents.

          Includes: own capability engine and MCP stdio server (both protocol eras: 2026-07-28 without handshake, and the initialize-based revisions), SQLite/FTS5 search in two stages with a Portuguese-to-English bridge, versioned checkpoints, governed memory, the React Flow architecture explorer and study map, a scenario doctor and the optional Laya profile.

          Start: extract the ZIP, install Node 24 LTS and Git, run `npm run setup`, then `node bin/bbrainx.mjs up --root /path/to/your/project`.

          Measured, not promised: on 79 blind natural-language questions over two third-party repositories the expected file is among the first 10 results in 84% of the cases (54% before). Details, intervals and limits are in docs/EVALUATION.md. CI evidence for the exact tested revision is in docs/validation/ci-report.json. Native platform and protocol tests are not a certification of every IDE. The Laya profile is installed only by an explicit command and does not change the context pack: without fine-tuning it ranked below the lexical path.

          Original core is MIT; the engine contract follows Invokta 0.9 (MIT notice in THIRD_PARTY_NOTICES.md). Remotion and the Laya profile retain their own terms. No credentials, installed node_modules, model weights, reference-repository copies or font files are included.
          NOTES
          gh release create v0.4.0-preview artifacts/BBrainX-v0.4.0-source.zip artifacts/SHA256SUMS.txt artifacts/source-manifest.json --target "$RELEASE_TARGET" --title 'BBrainX 0.4.0 — GODMODCODE Developer Preview' --notes-file notes.md --prerelease
